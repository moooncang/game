name: 업무 피드 검증
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tools
      - name: 결재 모듈 검사
        run: node site/tests/office-approve.check.mjs
      - name: Chromium 설치
        run: tools/node_modules/.bin/playwright install --with-deps chromium
      - name: 홈페이지 브라우저 회귀 검사
        shell: bash
        run: |
          export NODE_PATH="$PWD/tools/node_modules"
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory site > /tmp/office-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node site/tests/smoke.cjs
          node site/tests/feed-v2.cjs
          node site/tests/decisions.cjs
