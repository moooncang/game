name: 회사 홈페이지 배포
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  # PR 코드·산출물은 실행하지 않는다. 기본 브랜치만 빌드한다.
  pull_request_target:
    types: [opened, closed, reopened, edited]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'moooncang/game'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tools
      - run: node tools/build-site.mjs site _site
      - name: 실제 업무 피드 생성
        run: node tools/office-feed.mjs --output _site/feed.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
